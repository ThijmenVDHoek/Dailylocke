# ============================================================================
# Quality gate. Runs on every push and PR so a broken build never reaches the
# deploy workflow (which publishes `main` straight to Pages with no checks).
#
# STAGED, NOT ACTIVE: GitHub rejects pushes that add or edit a file under
# .github/workflows/ from an app without `workflows` permission. A maintainer
# with normal permissions activates it in one move:
#
#     mkdir -p .github/workflows && git mv tools/ci/check.yml .github/workflows/
# ============================================================================
name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install tooling
        run: npm ci --prefix tools

      # ESLint + the service-worker revision guard. The revision check is
      # what stops a deploy from shipping new JavaScript under an old cache
      # name, which would strand returning players on stale code with no way
      # to notice. There is no automated e2e/smoke suite -- gameplay is
      # verified by hand.
      - name: Lint and service-worker revision
        run: npm run check --prefix tools
